services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: checkout
      POSTGRES_PASSWORD: checkout
      POSTGRES_DB: checkout
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U checkout -d checkout']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
