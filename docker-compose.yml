services:
  postgres:
    image: postgres:16-alpine
    # Same variables the application reads from .env; defaults keep a fresh
    # clone working with no .env file present.
    environment:
      POSTGRES_USER: ${DB_USER:-checkout}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-checkout}
      POSTGRES_DB: ${DB_NAME:-checkout}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-checkout} -d ${DB_NAME:-checkout}']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
